[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "module_decea"
version = "0.0.1"
description = "Previsão de atraso de voos nos EUA (BTS On-Time Performance + METAR)"
authors = [
  { name = "rmotti" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
]
dependencies = [
    "airportsdata",
    "pyarrow",
    "jinja2",
    "matplotlib",
    "numpy",
    "pandas",
    "scikit-learn",
]
requires-python = "~=3.12.0"

[dependency-groups]
dev = [
    "ipykernel",
    "pytest",
    "ruff",
]


[tool.ruff]
line-length = 120
src = ["module_decea"]
include = ["pyproject.toml", "module_decea/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["module_decea"]
force-sort-within-sections = true
