# Baixa o VRA (ANAC) de vários anos na nuvem do GitHub e publica um zip por ano na Release "dados-vra".
# Uso: aba Actions -> "Baixar VRA da ANAC" -> Run workflow (escolha o ano inicial e final).
name: Baixar VRA da ANAC

on:
  workflow_dispatch:
    inputs:
      ano_inicio:
        description: "Primeiro ano"
        default: "2011"
        required: true
      ano_fim:
        description: "Último ano"
        default: "2024"
        required: true

permissions:
  contents: write

jobs:
  preparar:
    runs-on: ubuntu-latest
    outputs:
      anos: ${{ steps.anos.outputs.anos }}
    steps:
      - id: anos
        run: |
          python3 -c "import json; print('anos=' + json.dumps([str(a) for a in range(${{ inputs.ano_inicio }}, ${{ inputs.ano_fim }} + 1)]))" >> "$GITHUB_OUTPUT"
      - name: Criar a Release dados-vra (se ainda não existir)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view dados-vra --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
          gh release create dados-vra --repo "$GITHUB_REPOSITORY" --title "Dados VRA (ANAC)" \
            --notes "Um zip por ano com os CSVs mensais do VRA, baixados de siros.anac.gov.br pelo workflow 'Baixar VRA da ANAC'."

  baixar:
    needs: preparar
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4 # não sobrecarregar o servidor da ANAC
      matrix:
        ano: ${{ fromJSON(needs.preparar.outputs.anos) }}
    steps:
      - name: Baixar os arquivos de ${{ matrix.ano }}
        run: |
          python3 - <<'EOF'
          import pathlib, re, time, urllib.parse, urllib.request
          ano = "${{ matrix.ano }}"
          base = f"https://siros.anac.gov.br/siros/registros/diversos/vra/{ano}/"
          html = urllib.request.urlopen(base, timeout=120).read().decode("utf-8", "replace")
          links = sorted({urllib.parse.urljoin(base, h) for h in re.findall(r'href="([^"]+\.(?:csv|zip|txt))"', html, re.I)})
          print(f"{ano}: {len(links)} arquivos encontrados")
          if not links:
              raise SystemExit(f"nenhum arquivo listado em {base}")
          pasta = pathlib.Path(f"VRA_{ano}")
          pasta.mkdir()
          for url in links:
              nome = urllib.parse.unquote(url.rsplit("/", 1)[-1])
              for tentativa in range(5):
                  try:
                      urllib.request.urlretrieve(url, pasta / nome)
                      print(f"  ok {nome} ({(pasta / nome).stat().st_size / 1e6:.1f} MB)")
                      break
                  except Exception as e:
                      print(f"  falhou {nome} (tentativa {tentativa + 1}): {e}")
                      time.sleep(10 * (tentativa + 1))
              else:
                  raise SystemExit(f"não consegui baixar {url}")
              time.sleep(1)
          EOF
      - name: Compactar e publicar na Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip -9 -r -q "VRA_${{ matrix.ano }}.zip" "VRA_${{ matrix.ano }}"
          ls -lh "VRA_${{ matrix.ano }}.zip"
          gh release upload dados-vra "VRA_${{ matrix.ano }}.zip" --clobber --repo "$GITHUB_REPOSITORY"
