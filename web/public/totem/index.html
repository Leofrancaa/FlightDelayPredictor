<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>O aniversário de 94 anos — Previsão de atraso de voos</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:"Segoe UI",Inter,"Helvetica Neue",Arial,sans-serif;color:#fff}
  #stage{position:fixed;inset:0}
  #stage canvas{display:block;width:100%;height:100%}
  /* cinemascope bars */
  .bar{position:fixed;left:0;right:0;height:0;background:#000;z-index:2;pointer-events:none;transition:height .8s}
  .bar.top{top:0}.bar.bot{bottom:0}
  #sub{position:fixed;left:50%;transform:translateX(-50%);bottom:4vh;max-width:72vw;text-align:center;font-size:clamp(16px,2.1vw,34px);line-height:1.3;
       text-shadow:0 2px 6px #000,0 0 2px #000;opacity:0;transition:opacity .2s;z-index:3;pointer-events:none}
  #sub.on{opacity:1}
  #sub .who{display:block;font-size:.55em;letter-spacing:.18em;text-transform:uppercase;color:#9fd3ff;margin-bottom:.2em}
  .overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5;opacity:0;pointer-events:none;transition:opacity .6s}
  .overlay.on{opacity:1;pointer-events:auto}
  #start{background:radial-gradient(ellipse at center,rgba(5,10,25,.55),rgba(0,0,0,.92));cursor:pointer}
  #start h1{font-weight:300;font-size:clamp(28px,4.2vw,64px);margin:0 0 .2em;letter-spacing:.02em}
  #start p{color:#a9b8d6;font-size:clamp(14px,1.4vw,20px);margin:.2em}
  #start .play{margin-top:1.4em;width:96px;height:96px;border-radius:50%;border:2px solid #fff;display:flex;align-items:center;justify-content:center}
  #start .play:after{content:"";border-left:30px solid #fff;border-top:18px solid transparent;border-bottom:18px solid transparent;margin-left:8px}
  #endcard{background:#000}
  #endcard h2{font-weight:300;font-size:clamp(28px,4.4vw,72px);margin:0;opacity:0;transform:translateY(10px);transition:all 1.2s .4s}
  #endcard.on h2{opacity:1;transform:none}
  #endcard p{color:#9fb3d9;font-size:clamp(14px,1.5vw,22px);margin-top:1.4em;opacity:0;transition:opacity 1.2s 1.6s;text-align:center;line-height:1.5}
  #endcard.on p{opacity:1}
  #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:6;color:#9fb3d9;background:#000;font-size:18px}
  #controls{position:fixed;right:18px;bottom:18px;display:flex;gap:8px;z-index:7;opacity:0;transition:opacity .3s}
  #controls.on, body:hover #controls{opacity:1}
  #ui.playing #controls:not(.on){opacity:0}
  #ui.playing:hover #controls{opacity:.85}
  #ui.hide #controls{display:none}
  #controls button{background:rgba(20,26,40,.8);color:#fff;border:1px solid #3a4866;border-radius:8px;padding:8px 12px;font:inherit;font-size:13px;cursor:pointer}
  #meta{position:fixed;left:18px;bottom:18px;z-index:7;font-size:12px;color:#7f8ba3;opacity:.0;transition:opacity .3s}
  body:hover #meta{opacity:.8}
  #ui.hide #meta{display:none}
</style>
</head>
<body>
<div id="stage"></div>
<div class="bar top"></div><div class="bar bot"></div>
<div id="sub"></div>
<div id="loading">Carregando…</div>
<div id="start" class="overlay"><h1>O aniversário de 94 anos</h1><p>Uma previsão de atraso de voo</p><div class="play"></div><p style="margin-top:1.6em;font-size:13px">F: tela cheia · R: reiniciar · H: esconder controles</p></div>
<div id="endcard" class="overlay"><h2>Como esse totem funciona?</h2><p id="realcase"></p></div>
<div id="ui">
  <div id="meta"><span id="scenelabel"></span> · <span id="audiostatus"></span></div>
  <div id="controls">
    <button id="btn-subs">Legendas: on</button>
    <button id="btn-full">Tela cheia</button>
    <button id="btn-restart">Reiniciar</button>
  </div>
</div>
<script type="module" src="./main.js"></script>
</body>
</html>
